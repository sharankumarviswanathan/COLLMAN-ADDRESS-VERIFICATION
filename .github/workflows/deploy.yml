name: Deploy to Remote Ubuntu Server

on:
  workflow_dispatch: # Allows manual trigger from GitHub UI
  # Uncomment the lines below if you want automatic deployment on every git push:
  # push:
  #   branches: [ main ]

jobs:
  deploy:
    name: Auto Deploy to Ubuntu Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "Pulling latest code and updating Collman BGV..."
            cd /var/www/collman-bgv
            sudo bash update-ubuntu.sh
