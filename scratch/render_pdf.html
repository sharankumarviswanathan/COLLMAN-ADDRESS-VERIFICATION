<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Render PDF Page 1</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { margin: 0; background: #222; display: flex; justify-content: center; }
    canvas { box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin: 20px 0; max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <canvas id="pdf-canvas"></canvas>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const pdfUrl = 'http://localhost:5000/downloads/Collman_Address_Verification_12705_AV-2026-000006.pdf';

    pdfjsLib.getDocument(pdfUrl).promise.then(pdf => {
      console.log('PDF loaded, total pages:', pdf.numPages);
      return pdf.getPage(1);
    }).then(page => {
      // Scale 2.0 gives ~150-200 DPI clear rendering for inspection
      const viewport = page.getViewport({ scale: 2.0 });
      const canvas = document.getElementById('pdf-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      const renderContext = {
        canvasContext: ctx,
        viewport: viewport
      };

      return page.render(renderContext).promise.then(() => {
        console.log('Page 1 rendered to canvas:', canvas.width, 'x', canvas.height);
        document.body.classList.add('rendered');
        // Also save dataUrl to window for node script
        window.__CANVAS_DATA__ = canvas.toDataURL('image/png');
      });
    }).catch(err => {
      console.error('Render error:', err);
    });
  </script>
</body>
</html>
